name: sweetcare-dev

services:
  postgres:
    image: postgres:16-alpine
    container_name: sweetcare-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: sweetcare
      POSTGRES_PASSWORD: changeme
      POSTGRES_DB: sweetcare_dev
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./postgres/init.sql:/docker-entrypoint-initdb.d/01-init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sweetcare -d sweetcare_dev"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  redis:
    image: redis:7-alpine
    container_name: sweetcare-redis
    restart: unless-stopped
    command: >
      redis-server
      --maxmemory 256mb
      --maxmemory-policy allkeys-lru
      --requirepass changeme_redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "--no-auth-warning", "-a", "changeme_redis", "ping"]
      interval: 10s
      timeout: 5s
      retries: 3

  ai-service:
    build:
      context: ../../apps/ai-service
      dockerfile: Dockerfile.dev
    container_name: sweetcare-ai-service
    restart: unless-stopped
    environment:
      PORT: 8000
      ALLOWED_INTERNAL_HOST: api
      LOG_LEVEL: DEBUG
      ENVIRONMENT: development
    ports:
      - "8000:8000"
    volumes:
      - ../../apps/ai-service:/app
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')",
        ]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 30s
    networks:
      - default
      - internal

  # API only needed for integration testing — run with --profile api
  api:
    profiles: ["api"]
    build:
      context: ../../apps/api
      dockerfile: Dockerfile.dev
    container_name: sweetcare-api
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://sweetcare:changeme@postgres:5432/sweetcare_dev
      REDIS_URL: redis://:changeme_redis@redis:6379
      AI_SERVICE_URL: http://ai-service:8000
      NODE_ENV: development
      LOG_LEVEL: debug
    env_file:
      - ../../apps/api/.env
    ports:
      - "3000:3000"
    volumes:
      - ../../apps/api:/app
      - /app/node_modules
    networks:
      - default
      - internal

networks:
  internal:
    internal: true # ai-service not reachable from host

volumes:
  postgres_data:
  redis_data:
