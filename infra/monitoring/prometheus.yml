global:
  scrape_interval: 15s
  evaluation_interval: 15s
  external_labels:
    env: development
    project: sweetcare

scrape_configs:
  - job_name: sweetcare-api
    scrape_interval: 15s
    metrics_path: /metrics
    static_configs:
      # host.docker.internal resolves to the host machine from within Docker.
      # Linux users: replace with the host IP (e.g., 172.17.0.1) or use
      # extra_hosts in compose.monitoring.yml.
      - targets: ["host.docker.internal:3000"]
        labels:
          service: api
          runtime: nodejs
