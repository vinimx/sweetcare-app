name: CI

on:
  push:
    branches: [main, "feature/**", "001-*"]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: "20"
  PYTHON_VERSION: "3.12"
  PNPM_VERSION: "9.15.0"

jobs:
  # ─────────────── TypeScript: lint + typecheck + build ───────────────
  typescript:
    name: TypeScript (lint · typecheck · build)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Generate Prisma client
        run: pnpm --filter "@sweetcare/api" db:generate

      - name: Format check
        run: pnpm format:check

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Build shared packages
        run: pnpm --filter "@sweetcare/shared-*" build

      - name: Build API
        run: pnpm --filter "@sweetcare/api" build

  # ─────────────── API unit tests ───────────────────────────────────────
  api-test:
    name: API Tests
    runs-on: ubuntu-latest
    needs: typescript

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: sweetcare
          POSTGRES_PASSWORD: sweetcare_test
          POSTGRES_DB: sweetcare_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U sweetcare"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DATABASE_URL: postgresql://sweetcare:sweetcare_test@localhost:5432/sweetcare_test
      JWT_ACCESS_SECRET: ci-access-secret-must-be-at-least-32-chars
      JWT_REFRESH_SECRET: ci-refresh-secret-must-be-at-least-32-chars
      PHI_ENCRYPTION_KEY: ${{ secrets.CI_PHI_ENCRYPTION_KEY || 'aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa' }}
      REDIS_URL: redis://localhost:6379
      NODE_ENV: test

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build shared packages
        run: pnpm --filter "@sweetcare/shared-*" build

      - name: Run API tests
        run: pnpm --filter "@sweetcare/api" test:coverage

      - name: Upload coverage
        uses: codecov/codecov-action@v4
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          flags: api
          fail_ci_if_error: false

  # ─────────────── AI Service (Python) ──────────────────────────────────
  ai-service:
    name: AI Service (lint · typecheck · test)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/ai-service

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install uv
        run: pip install uv

      - name: Install dependencies
        run: uv pip install --system -e ".[dev]"

      - name: Lint (ruff)
        run: ruff check app tests

      - name: Type check (mypy)
        run: mypy app

      - name: Run tests
        run: pytest

  # ─────────────── Security gate ────────────────────────────────────────
  security:
    name: Security scan
    runs-on: ubuntu-latest
    needs: typescript
    steps:
      - uses: actions/checkout@v4

      - name: Audit npm dependencies
        run: npx audit-ci --moderate

      - name: Scan for secrets
        uses: trufflesecurity/trufflehog@main
        with:
          path: ./
          base: ${{ github.event.repository.default_branch }}
          extra_args: --only-verified

  # ─────────────── Constitution gate ────────────────────────────────────
  constitution-check:
    name: Constitution gate (manual review reminder)
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@v4
      - name: Verify constitution gates
        run: |
          echo "Constitution v1.0.0 gates required for merge:"
          echo "  ✓ Architecture gate"
          echo "  ✓ Security gate"
          echo "  ✓ Testing gate"
          echo "  ✓ UX/accessibility gate"
          echo "  ✓ Performance/resilience gate"
          echo "  ✓ Review gate"
          echo "Reviewer: confirm all gates in PR checklist before merging."
